# Isolated attack lab. The network is `internal: true`: containers can reach each other but
# have NO route to the host LAN or the internet. Never change that, never add `ports:`.
# Usage (Windows PowerShell, Docker Desktop):  cd lab ; .\run_lab.ps1
# or manually:  docker compose up --build --abort-on-container-exit attacker ; docker compose down
name: tdlab
networks:
  labnet:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.66.0.0/24
services:
  target:
    build: ./target
    networks:
      labnet:
        ipv4_address: 10.66.0.10
  capture:
    build: ./capture
    network_mode: "service:target"   # sniff the target's interface
    cap_add: [NET_RAW, NET_ADMIN]
    volumes:
      - ./captures:/captures
    depends_on: [target]
  attacker:
    build:
      context: .
      dockerfile: attacker/Dockerfile
    cap_add: [NET_RAW]
    networks:
      labnet:
        ipv4_address: 10.66.0.66
    volumes:
      - ./captures:/captures
    depends_on: [target, capture]
